[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "star_shadow_pip"
version = "0.0.1"
authors = [
  { name="freestket", email="freestaquet@hotmail.com" },
]
description = "Pip installable version of Star Shadow"
readme = "README.md"
requires-python = ">=3.6"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Unix",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/freestket/star_shadow"
Issues = "https://github.com/freestket/star_shadow/issues"